name: Sync to Simply.com

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Simply.com via FTP
        uses: webfactory/ftp-deploy@master
        with:
          ftp-server: ftp://ftp.simply.com:21/public_html
          ftp-username: ${{ secrets.SIMPLY_FTP_USER }}
          ftp-password: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          gitDepth: false
