{"name":"Sync to Simply.com","on":{"push":{"branches":["main"]}},"concurrency":{"group":"simply-production","cancel-in-progress":false},"jobs":{"sync":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Install lftp","run":"sudo apt-get update && sudo apt-get install -y lftp"},{"name":"Sync to Simply.com via FTP","run":"lftp -c \"set ftp:ssl-force true;\nopen ftp.simply.com;\nuser ${{ secrets.SIMPLY_FTP_USER }} ${{ secrets.SIMPLY_FTP_PASSWORD }};\nmirror -R --verbose --no-perms --exclude-glob .git/ --exclude-glob .github/ ./ /public_html/\""}]}}}
